[package]
name = "fablewood"
version = "0.1.0"
description = "FABLEWOOD — a knowledge-retention RPG (the Ledger Realms), desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }

[profile.release]
codegen-units = 1
lto = true
